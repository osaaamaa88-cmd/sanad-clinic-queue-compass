name: Android Build (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The app loads the live site (server.url), so the bundled web folder is only a fallback shell.
      - name: Prepare web shell
        run: |
          mkdir -p dist/client
          echo '<!doctype html><meta charset="utf-8"><title>سند</title><script>location.href="https://sanad-your-clinic-buddy.lovable.app"</script>' > dist/client/index.html

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0F172A' --splashBackgroundColor '#0F172A' || true
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sanad-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release.aab "${{ secrets.KEY_ALIAS }}"

      - name: Upload AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sanad-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
